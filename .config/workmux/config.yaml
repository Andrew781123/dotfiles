agent: opencode
nerdfont: true
mode: session
# ^d in the sesh picker removes the worktree non-interactively. Uncommitted
# changes are still blocked; only the unmerged-branch prompt is skipped.
confirm_unmerged_removal: false

files:
  copy:
    - .env
    - local

windows:
  - {}
  - panes:
      - command: opencode
        focus: true
      - split: horizontal
      - split: vertical
        target: 0
      - split: vertical
        target: 1

post_create:
  - 'grep -qxF .agent-session.md "$(git rev-parse --git-path info/exclude)" 2>/dev/null || echo .agent-session.md >> "$(git rev-parse --git-path info/exclude)"'
