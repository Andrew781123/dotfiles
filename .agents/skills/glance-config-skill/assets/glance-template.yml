pages:
  - name: Home
    columns:
      - size: small
        widgets:
          - type: calendar
            first-day-of-week: monday

          - type: clock
            hour-format: 24h

          - type: weather
            location: London, United Kingdom
            units: metric
            hour-format: 24h

      - size: full
        widgets:
          - type: search
            search-engine: duckduckgo
            autofocus: true
            bangs:
              - title: GitHub
                shortcut: gh
                url: https://github.com/search?q={QUERY}
              - title: YouTube
                shortcut: yt
                url: https://www.youtube.com/results?search_query={QUERY}

          - type: group
            widgets:
              - type: hacker-news
                limit: 15
                sort-by: top
              - type: lobsters
                limit: 15
                sort-by: hot

          - type: videos
            channels:
              - UCsBjURrPoezykLs9EqgamOA # Fireship
              - UCHnyfMqiRRG1u-2MsSQLbXA # Veritasium
            limit: 10
            style: grid-cards
            collapse-after-rows: 2

      - size: small
        widgets:
          - type: markets
            markets:
              - symbol: SPY
                name: S&P 500
              - symbol: BTC-USD
                name: Bitcoin

          - type: bookmarks
            groups:
              - title: Links
                links:
                  - title: GitHub
                    url: https://github.com
                    icon: si:github
                  - title: Reddit
                    url: https://reddit.com
                    icon: si:reddit
