# llm-list.yaml — your models, tiers, effort values, cost
#
# Read by the llm-task-router skill. Edit freely.
#
# Fields:
#   name:      display name
#   id:        <provider>/<model> as accepted by the CLI
#   tier:      light | standard | heavy
#   speed:     fast | medium | slow   (qualitative only — NOT tokens/sec)
#   effort:    effort values the model accepts, or "off" if none
#   context:   context window in tokens
#   inputs:    text | image | pdf | video | audio
#   privacy:   private (no training) | logs | trains
#   cost:      per 1M tokens; "FREE" for $0. Cache-read matters as much as input.
#   strengths: short tags
#   also_on:   same model elsewhere (provider: model-id)
#   notes:     caveats
#
# Tiers are cost/capability bands. "light" = all free models plus models whose
# blended agentic cost is <= deepseek-v4.1-flash (cache-read dominates: ~38% of
# a typical agentic request, so cheap input alone does not make a model cheap).
#
# Providers in use this month: opencode-go (primary), opencode Zen free tier,
# commandcode (secondary). commandcode entries are marked [cmd]; delete them
# when you stop subscribing.

models:
  # ============ LIGHT — free models, effort = off ============
  - name: Big Pickle (free)
    id: opencode/big-pickle
    tier: light
    speed: medium
    effort: off
    context: 1000000
    inputs: [text]
    privacy: logs
    cost: FREE
    strengths: [quick-edits, questions]
    notes: Stealth model; may log data. Simple tasks only.

